name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ea1a7396b05637a53bf23c078647ecc0edee4b80

      # Windows is multi-config, so its configure preset name is just the OS base name.
      # Plain "unix" is single-config Debug-only, so the CI matrix (which needs both
      # Debug and Release) uses "unix-ninja" instead on Linux/macOS.
      - name: Determine CMake presets
        id: presets
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            base=windows
          else
            base=unix-ninja
          fi
          build=$base
          if [ "${{ matrix.build_type }}" = "Release" ]; then
            build=$base-release
          fi
          echo "configure=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # raylib is built from source via FetchContent (see root CMakeLists.txt for why).
      # Cache its clone + compiled objects so only a raylib version bump pays the full
      # cost again; Debug and Release share this cache since both build_types configure
      # into the same preset's binary dir.
      - name: Cache raylib FetchContent build
        uses: actions/cache@v4
        with:
          path: out/build/${{ steps.presets.outputs.configure }}/_deps
          key: raylib-fetchcontent-${{ matrix.os }}-${{ steps.presets.outputs.configure }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ steps.presets.outputs.configure }}

      - name: Build
        run: cmake --build --preset ${{ steps.presets.outputs.build }}
